<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora Skull - Mentoria & Câmbio Global</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Courier New', Courier, monospace;
            user-select: none;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: radial-gradient(circle at center, #141110 0%, #080605 60%, #020202 100%);
            overflow-x: hidden;
            position: relative;
            padding: 25px;
            color: #d1cfc7;
        }

        /* --- Layout --- */
        .app-wrapper {
            position: relative;
            z-index: 2;
            display: flex;
            flex-wrap: wrap;
            gap: 24px;
            justify-content: center;
            align-items: stretch;
            max-width: 1400px;
            width: 100%;
        }

        /* --- Calculadora Container --- */
        .calculator-container {
            width: 370px;
            background: #100e0d;
            border-radius: 35px 35px 25px 25px;
            padding: 20px 18px;
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.9), inset 0 0 15px rgba(255, 255, 255, 0.02);
            border: 2px solid #2e221b;
            display: flex;
            flex-direction: column;
            align-items: center;
            transition: border-color 0.3s ease;
        }

        .skull-top {
            width: 85px;
            height: 75px;
            margin-bottom: 2px;
            filter: drop-shadow(0 0 10px rgba(180, 50, 20, 0.4));
            animation: skullPulse 3s infinite ease-in-out;
        }

        @keyframes skullPulse {
            0%, 100% { transform: translateY(0); filter: drop-shadow(0 0 8px rgba(180, 50, 20, 0.3)); }
            50% { transform: translateY(-3px); filter: drop-shadow(0 0 16px rgba(220, 60, 20, 0.6)); }
        }

        .bone-divider {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 95%;
            margin: 8px 0;
        }

        .bone-joint {
            width: 10px;
            height: 10px;
            background: #c2b59d;
            border-radius: 50%;
            box-shadow: inset -1px -1px 3px rgba(0,0,0,0.6);
        }

        .bone-bar {
            flex-grow: 1;
            height: 4px;
            background: linear-gradient(90deg, #968670, #ded4c1, #968670);
            border-radius: 4px;
            margin: 0 -4px;
        }

        /* --- Barra de Moedas --- */
        .currency-bar {
            width: 100%;
            display: grid;
            grid-template-columns: 1fr auto 1fr auto;
            gap: 6px;
            align-items: center;
            background: #080605;
            border: 1px solid #2e221b;
            border-radius: 10px;
            padding: 6px 8px;
            margin-bottom: 8px;
        }

        .currency-select {
            background: #17120e;
            color: #e59a60;
            border: 1px solid #3d2b20;
            border-radius: 6px;
            padding: 4px;
            font-size: 11px;
            font-weight: bold;
            outline: none;
            cursor: pointer;
            width: 100%;
            transition: all 0.2s ease;
        }

        .currency-select:hover, .currency-select:focus {
            border-color: #d35400;
        }

        .currency-symbol-tag {
            color: #c2b59d;
            font-size: 12px;
            font-weight: bold;
            text-align: center;
        }

        .btn-convert-action {
            background: #3a150c;
            color: #ff9e79;
            border: 1px solid #732a18;
            border-radius: 6px;
            padding: 4px 8px;
            font-size: 10px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.2s ease;
        }
        .btn-convert-action:hover {
            background: #5e2011;
            color: #fff;
            box-shadow: 0 0 10px rgba(220, 60, 20, 0.4);
        }

        /* --- Visor Digital --- */
        .display-box {
            width: 100%;
            background: #060505;
            border: 2px solid #2b1d16;
            border-radius: 12px;
            padding: 10px 14px;
            margin-bottom: 6px;
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            box-shadow: inset 0 3px 8px rgba(0,0,0,0.8);
        }

        .currency-indicator {
            font-size: 10px;
            color: #d36a32;
            letter-spacing: 1px;
            margin-bottom: 2px;
        }

        #display {
            width: 100%;
            background: transparent;
            border: none;
            color: #ff6622;
            font-size: 26px;
            font-weight: bold;
            text-align: right;
            text-shadow: 0 0 8px rgba(255, 80, 20, 0.4);
            outline: none;
            letter-spacing: 1px;
        }

        /* --- Teclado & Fluidez --- */
        .keypad {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 9px;
            width: 100%;
            padding: 8px 0;
        }

        button {
            height: 44px;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            outline: none;
            transition: transform 0.08s ease, background 0.15s ease, box-shadow 0.15s ease;
        }

        button:active, button.key-pressed {
            transform: scale(0.94);
        }

        .btn-num {
            background: #1a1715;
            color: #d1cfc7;
            border: 1px solid #2d2621;
            box-shadow: 0 3px 0 #0d0c0a;
        }
        .btn-num:hover, .btn-num.key-pressed {
            background: #2b2520;
            color: #fff;
            border-color: #55483d;
        }

        .btn-op {
            background: #2b110b;
            color: #ffaa88;
            border: 1px solid #4a1d12;
            box-shadow: 0 3px 0 #140704;
        }
        .btn-op:hover, .btn-op.key-pressed {
            background: #471b11;
            color: #fff;
            border-color: #8c321d;
        }

        .btn-clear {
            background: #24201e;
            color: #ff6666;
            border: 1px solid #3d3532;
            box-shadow: 0 3px 0 #0f0d0c;
        }
        .btn-clear:hover, .btn-clear.key-pressed {
            background: #3b3330;
            color: #ff8888;
        }

        .btn-eq {
            grid-column: span 2;
            background: #bd3900;
            color: #fff;
            border: 1px solid #e64a00;
            box-shadow: 0 3px 0 #611e00;
        }
        .btn-eq:hover, .btn-eq.key-pressed {
            background: #db4400;
            box-shadow: 0 3px 0 #611e00, 0 0 12px rgba(220, 68, 0, 0.4);
        }

        /* --- Dashboard Lateral --- */
        .side-dashboard {
            flex: 1;
            min-width: 480px;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        /* --- Gráfico de Volatilidade --- */
        .chart-panel {
            background: #100e0d;
            border: 2px solid #2e221b;
            border-radius: 20px;
            padding: 14px 18px;
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.9);
            display: flex;
            flex-direction: column;
        }

        .chart-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
            flex-wrap: wrap;
            gap: 6px;
        }

        .chart-title-box {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .chart-title {
            color: #e5672d;
            font-size: 13px;
            text-transform: uppercase;
            letter-spacing: 1.5px;
        }

        .period-toggle {
            display: flex;
            background: #080605;
            border-radius: 4px;
            border: 1px solid #2e221b;
            overflow: hidden;
        }

        .btn-period {
            background: transparent;
            border: none;
            color: #777;
            font-size: 10px;
            padding: 2px 8px;
            height: 22px;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .btn-period.active {
            background: #bd3900;
            color: #fff;
        }

        .market-metrics {
            display: flex;
            gap: 12px;
            font-size: 11px;
        }

        .metric-item { color: #888; }
        .metric-val { font-weight: bold; }
        .val-up { color: #00cc66; }
        .val-down { color: #dd3333; }

        .chart-wrapper {
            width: 100%;
            height: 120px;
            position: relative;
            background: #060505;
            border: 1px solid #241a14;
            border-radius: 8px;
            overflow: hidden;
        }

        #volatilityCanvas {
            width: 100%;
            height: 100%;
        }

        /* --- Planilha de Histórico --- */
        .history-panel {
            flex: 1;
            background: #100e0d;
            border: 2px solid #2e221b;
            border-radius: 20px;
            padding: 16px;
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.9);
            max-height: 420px;
            display: flex;
            flex-direction: column;
        }

        .history-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
            border-bottom: 1px solid #2e221b;
            padding-bottom: 6px;
        }

        .history-header h2 {
            color: #e5672d;
            font-size: 13px;
            text-transform: uppercase;
            letter-spacing: 1.5px;
        }

        .btn-clear-history {
            background: #24110c;
            color: #ff9e79;
            border: 1px solid #4a1d12;
            padding: 4px 10px;
            border-radius: 6px;
            font-size: 11px;
            cursor: pointer;
            transition: all 0.2s ease;
        }
        .btn-clear-history:hover {
            background: #3b1911;
            color: #fff;
        }

        .table-container {
            overflow-y: auto;
            flex-grow: 1;
        }

        .table-container::-webkit-scrollbar {
            width: 6px;
        }
        .table-container::-webkit-scrollbar-thumb {
            background: #332017;
            border-radius: 4px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 11px;
            text-align: left;
        }

        th {
            background: #080605;
            color: #c2b59d;
            padding: 7px 6px;
            border: 1px solid #241a14;
            position: sticky;
            top: 0;
            z-index: 1;
            text-transform: uppercase;
        }

        td {
            padding: 6px;
            border: 1px solid #1c1410;
            color: #ccc;
            background: #0b0908;
        }

        tr:hover td {
            background: #1a120c;
        }

        .desc-input {
            width: 100%;
            background: transparent;
            border: 1px dashed #3a2b20;
            color: #ff9e66;
            padding: 3px 5px;
            font-size: 11px;
            border-radius: 4px;
            outline: none;
            transition: all 0.2s ease;
        }
        .desc-input:focus {
            border: 1px solid #bd3900;
            background: #050403;
        }

        .tag-calc { color: #999; white-space: nowrap; }
        .tag-res { color: #00dd77; font-weight: bold; white-space: nowrap; }
        .tag-curr { color: #ffaa00; font-weight: bold; }

        /* --- Manifestação do Mentor Exu Caveira (Capa e Foice) --- */
        .exu-mentor-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.92);
            z-index: 9999;
            display: flex;
            justify-content: center;
            align-items: center;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.25s ease;
        }

        .exu-mentor-overlay.active {
            opacity: 1;
            pointer-events: all;
        }

        .exu-card {
            background: #110d0a;
            border: 2px solid #b32d00;
            border-radius: 20px;
            padding: 28px;
            max-width: 520px;
            width: 90%;
            text-align: center;
            box-shadow: 0 0 50px rgba(179, 45, 0, 0.4);
            transform: scale(0.9);
            transition: transform 0.25s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .exu-mentor-overlay.active .exu-card {
            transform: scale(1);
        }

        .exu-avatar {
            width: 150px;
            height: 130px;
            margin: 0 auto 10px auto;
            filter: drop-shadow(0 0 12px rgba(220, 50, 0, 0.5));
            animation: exuFloat 3s infinite ease-in-out;
        }

        @keyframes exuFloat {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-6px); }
        }

        .exu-title {
            color: #ff5511;
            font-size: 19px;
            font-weight: bold;
            letter-spacing: 2px;
            text-transform: uppercase;
            margin-bottom: 12px;
        }

        .exu-dialogue {
            color: #e5ded5;
            font-size: 14px;
            line-height: 1.6;
            margin-bottom: 22px;
            border-left: 3px solid #b32d00;
            border-right: 3px solid #b32d00;
            padding: 12px 16px;
            background: #080605;
            font-style: italic;
        }

        .exu-btn-dismiss {
            background: #b32d00;
            color: #fff;
            border: 1px solid #e63900;
            padding: 10px 24px;
            border-radius: 8px;
            font-size: 13px;
            font-weight: bold;
            letter-spacing: 1px;
            cursor: pointer;
            transition: all 0.2s ease;
        }
        .exu-btn-dismiss:hover {
            background: #d43500;
            box-shadow: 0 0 15px rgba(212, 53, 0, 0.6);
        }
    </style>
</head>
<body>

    <div class="app-wrapper">
        <!-- Calculadora -->
        <div class="calculator-container">
            <svg class="skull-top" viewBox="0 0 100 90" fill="none" xmlns="http://www.w3.org/2000/svg">
                <path d="M50 5 C25 5 15 25 15 45 C15 57 20 65 28 68 C28 75 32 82 36 82 C40 82 42 78 50 78 C58 78 60 82 64 82 C68 82 72 75 72 68 C80 65 85 57 85 45 C85 25 75 5 50 5 Z" fill="#c2b59d" stroke="#241a14" stroke-width="2.5"/>
                <path d="M16 45 C22 47 24 57 28 68 L20 60 Z" fill="#9c8c74"/>
                <path d="M84 45 C78 47 76 57 72 68 L80 60 Z" fill="#9c8c74"/>
                <ellipse cx="34" cy="45" rx="10" ry="13" fill="#0d0a08" transform="rotate(6 34 45)"/>
                <ellipse cx="66" cy="45" rx="10" ry="13" fill="#0d0d08" transform="rotate(-6 66 45)"/>
                <circle cx="35" cy="46" r="3.5" fill="#e54411"/>
                <circle cx="65" cy="46" r="3.5" fill="#e54411"/>
                <circle cx="35" cy="46" r="1.5" fill="#fff"/>
                <circle cx="65" cy="46" r="1.5" fill="#fff"/>
                <path d="M50 53 L45 64 L55 64 Z" fill="#0d0a08"/>
                <line x1="38" y1="72" x2="38" y2="80" stroke="#0d0a08" stroke-width="2"/>
                <line x1="44" y1="72" x2="44" y2="78" stroke="#0d0a08" stroke-width="2"/>
                <line x1="50" y1="72" x2="50" y2="78" stroke="#0d0a08" stroke-width="2"/>
                <line x1="56" y1="72" x2="56" y2="78" stroke="#0d0a08" stroke-width="2"/>
                <line x1="62" y1="72" x2="62" y2="80" stroke="#0d0a08" stroke-width="2"/>
            </svg>

            <div class="bone-divider">
                <div class="bone-joint"></div>
                <div class="bone-bar"></div>
                <div class="bone-joint"></div>
            </div>

            <!-- Conversor Automático -->
            <div class="currency-bar">
                <select id="sourceCurrency" class="currency-select" onchange="changeCurrency()"></select>
                <span class="currency-symbol-tag">➔</span>
                <select id="targetCurrency" class="currency-select"></select>
                <button class="btn-convert-action" onclick="convertCurrentValue()">CONV</button>
            </div>

            <div class="display-box">
                <span id="currencyIndicator" class="currency-indicator">BRL (R$) • 2 Decimais</span>
                <input type="text" id="display" readonly value="0">
            </div>

            <div class="bone-divider">
                <div class="bone-joint"></div>
                <div class="bone-bar"></div>
                <div class="bone-joint"></div>
            </div>

            <div class="keypad">
                <button id="key-c" class="btn-clear" onclick="clearDisplay()">C</button>
                <button id="key-div" class="btn-op" onclick="setOP('/')">/</button>
                <button id="key-mul" class="btn-op" onclick="setOP('*')">×</button>
                <button id="key-sub" class="btn-op" onclick="setOP('-')">-</button>

                <button id="key-7" class="btn-num" onclick="addDigit('7')">7</button>
                <button id="key-8" class="btn-num" onclick="addDigit('8')">8</button>
                <button id="key-9" class="btn-num" onclick="addDigit('9')">9</button>
                <button id="key-add" class="btn-op" onclick="setOP('+')">+</button>

                <button id="key-4" class="btn-num" onclick="addDigit('4')">4</button>
                <button id="key-5" class="btn-num" onclick="addDigit('5')">5</button>
                <button id="key-6" class="btn-num" onclick="addDigit('6')">6</button>
                <button id="key-dot" class="btn-num" onclick="addDigit('.')">.</button>

                <button id="key-1" class="btn-num" onclick="addDigit('1')">1</button>
                <button id="key-2" class="btn-num" onclick="addDigit('2')">2</button>
                <button id="key-3" class="btn-num" onclick="addDigit('3')">3</button>
                <button id="key-0" class="btn-num" onclick="addDigit('0')">0</button>

                <button id="key-del" class="btn-clear" onclick="deleteDigit()">DEL</button>
                <button id="key-eq" class="btn-eq" onclick="calculate()">=</button>
            </div>
        </div>

        <!-- Dashboard Lateral -->
        <div class="side-dashboard">
            
            <!-- Painel de Volatilidade -->
            <div class="chart-panel">
                <div class="chart-header">
                    <div class="chart-title-box">
                        <span id="chartCurrencyTitle" class="chart-title">Volatilidade: BRL</span>
                        <div class="period-toggle">
                            <button id="btn24h" class="btn-period active" onclick="setPeriod('24h')">24H</button>
                            <button id="btn7d" class="btn-period" onclick="setPeriod('7d')">7D</button>
                        </div>
                    </div>
                    <div class="market-metrics">
                        <span class="metric-item">Tendência: <span id="trendVal" class="metric-val val-up">+1.42% ▲</span></span>
                        <span class="metric-item">Volatilidade: <span id="volVal" class="metric-val">Alta</span></span>
                    </div>
                </div>
                <div class="chart-wrapper">
                    <canvas id="volatilityCanvas"></canvas>
                </div>
            </div>

            <!-- Planilha de Histórico -->
            <div class="history-panel">
                <div class="history-header">
                    <h2>Planilha de Cálculos & Câmbio</h2>
                    <button class="btn-clear-history" onclick="clearHistory()">Limpar Tabela</button>
                </div>
                <div class="table-container">
                    <table id="historyTable">
                        <thead>
                            <tr>
                                <th style="width: 20%;">Data / Hora</th>
                                <th style="width: 12%;">Moeda</th>
                                <th style="width: 23%;">Operação / Câmbio</th>
                                <th style="width: 20%;">Resultado</th>
                                <th style="width: 25%;">Descrição</th>
                            </tr>
                        </thead>
                        <tbody id="historyBody"></tbody>
                    </table>
                </div>
            </div>

        </div>
    </div>

    <!-- Modal do Mentor Exu Caveira (Capa & Foice) -->
    <div id="exuModal" class="exu-mentor-overlay">
        <div class="exu-card">
            <svg class="exu-avatar" viewBox="0 0 160 140" fill="none" xmlns="http://www.w3.org/2000/svg">
                <!-- Cabo da Foice -->
                <path d="M120 15 L85 130" stroke="#5c3a21" stroke-width="4.5" stroke-linecap="round"/>
                <!-- Lâmina Curva da Foice -->
                <path d="M120 15 C135 10 155 25 150 45 C145 32 132 25 120 22 Z" fill="#999" stroke="#ddd" stroke-width="1.5"/>
                <path d="M120 15 C125 12 145 28 140 42 C133 30 125 24 116 20 Z" fill="#fff" opacity="0.4"/>

                <!-- Capa Escura com Capuz -->
                <path d="M30 135 C30 80 42 50 65 35 C88 50 100 80 100 135 Z" fill="#0d0907" stroke="#2b1a12" stroke-width="2.5"/>
                <!-- Forro Interno Vermelho da Capa -->
                <path d="M42 135 C45 90 52 65 65 52 C78 65 85 90 88 135 Z" fill="#520e06"/>

                <!-- Crânio sob o Capuz -->
                <path d="M65 48 C53 48 46 58 46 70 C46 78 50 84 54 86 L54 94 C54 97 58 97 65 97 C72 97 76 97 76 94 L76 86 C80 84 84 78 84 70 C84 58 77 48 65 48 Z" fill="#d9ceb8" stroke="#1f140e" stroke-width="1.8"/>
                
                <!-- Olhos Incandescentes -->
                <ellipse cx="57" cy="68" rx="5" ry="7" fill="#080504"/>
                <ellipse cx="73" cy="68" rx="5" ry="7" fill="#080504"/>
                <circle cx="57" cy="68" r="2.8" fill="#ff3300"/>
                <circle cx="73" cy="68" r="2.8" fill="#ff3300"/>
                <circle cx="57" cy="68" r="1" fill="#fff"/>
                <circle cx="73" cy="68" r="1" fill="#fff"/>

                <!-- Nariz e Dentes -->
                <path d="M65 73 L62 80 L68 80 Z" fill="#080504"/>
                <line x1="58" y1="90" x2="58" y2="94" stroke="#080504" stroke-width="1.5"/>
                <line x1="62" y1="90" x2="62" y2="94" stroke="#080504" stroke-width="1.5"/>
                <line x1="65" y1="90" x2="65" y2="94" stroke="#080504" stroke-width="1.5"/>
                <line x1="68" y1="90" x2="68" y2="94" stroke="#080504" stroke-width="1.5"/>
                <line x1="72" y1="90" x2="72" y2="94" stroke="#080504" stroke-width="1.5"/>
            </svg>

            <div class="exu-title">Exu Caveira Adverte:</div>
            <div id="exuMessage" class="exu-dialogue"></div>
            <button class="exu-btn-dismiss" onclick="dismissMentor()">ENTENDIDO, MESTRE</button>
        </div>
    </div>

    <!-- Scripts -->
    <script>
        const CURRENCIES = {
            BRL: { symbol: 'R$', decimals: 2, rateToUSD: 0.18, volFactor: 0.12, name: 'Brasil (Real)' },
            USD: { symbol: '$', decimals: 2, rateToUSD: 1.0, volFactor: 0.04, name: 'EUA (Dólar)' },
            EUR: { symbol: '€', decimals: 2, rateToUSD: 1.08, volFactor: 0.05, name: 'Zona do Euro (Euro)' },
            GBP: { symbol: '£', decimals: 2, rateToUSD: 1.28, volFactor: 0.06, name: 'Reino Unido (Libra)' },
            JPY: { symbol: '¥', decimals: 0, rateToUSD: 0.0068, volFactor: 0.07, name: 'Japão (Iene)' },
            CAD: { symbol: 'C$', decimals: 2, rateToUSD: 0.74, volFactor: 0.06, name: 'Canadá (Dólar)' },

        /* --- Gráfico de Volatilidade 24H / 7D --- */
        const chartCanvas = document.getElementById('volatilityCanvas');
        const chartCtx = chartCanvas.getContext('2d');
        let chartDataPoints = [];
        let currentPeriod = '24h';

        function setPeriod(p) {
            currentPeriod = p;
            document.getElementById('btn24h').classList.toggle('active', p === '24h');
            document.getElementById('btn7d').classList.toggle('active', p === '7d');
            initVolatilityData(selectedCurrency);
        }

        function initVolatilityData(currCode) {
            const meta = CURRENCIES[currCode] || CURRENCIES.BRL;
            const basePrice = meta.rateToUSD;
            chartDataPoints = [];
            const pointsCount = currentPeriod === '24h' ? 30 : 60;
            const volatilityMultiplier = currentPeriod === '24h' ? 0.08 : 0.22;
            let currentVal = basePrice;

            for (let i = 0; i < pointsCount; i++) {
                const variance = (Math.random() - 0.48) * (meta.volFactor * currentVal * volatilityMultiplier);
                currentVal += variance;
                if (currentVal <= 0.000001) currentVal = basePrice * 0.5;
                chartDataPoints.push(currentVal);
            }

            updateChartUI(currCode);
            drawChart();
        }

        function updateChartUI(currCode) {
            const meta = CURRENCIES[currCode] || CURRENCIES.BRL;
            const titleEl = document.getElementById('chartCurrencyTitle');
            const trendEl = document.getElementById('trendVal');
            const volEl = document.getElementById('volVal');

            titleEl.textContent = `Acompanhamento: ${meta.name} (${currentPeriod.toUpperCase()})`;

            const firstPoint = chartDataPoints[0];
            const lastPoint = chartDataPoints[chartDataPoints.length - 1];
            const diffPct = ((lastPoint - firstPoint) / firstPoint) * 100;

            if (diffPct >= 0) {
                trendEl.textContent = `+${diffPct.toFixed(2)}% ▲`;
                trendEl.className = 'metric-val val-up';
            } else {
                trendEl.textContent = `${diffPct.toFixed(2)}% ▼`;
                trendEl.className = 'metric-val val-down';
            }

            const volPercentage = (meta.volFactor * 100).toFixed(1);
            const level = meta.volFactor > 0.25 ? 'Altíssima' : (meta.volFactor > 0.08 ? 'Moderada' : 'Estável');
            volEl.textContent = `${level} (${volPercentage}%)`;
        }

        function drawChart() {
            const cWidth = chartCanvas.width = chartCanvas.parentElement.clientWidth;
            const cHeight = chartCanvas.height = chartCanvas.parentElement.clientHeight;

            chartCtx.clearRect(0, 0, cWidth, cHeight);

            chartCtx.strokeStyle = '#1a130f';
            chartCtx.lineWidth = 1;
            for (let y = 20; y < cHeight; y += 30) {
                chartCtx.beginPath();
                chartCtx.moveTo(0, y);
                chartCtx.lineTo(cWidth, y);
                chartCtx.stroke();
            }

            const minVal = Math.min(...chartDataPoints);
            const maxVal = Math.max(...chartDataPoints);
            const range = (maxVal - minVal) || 1;
            const stepX = cWidth / (chartDataPoints.length - 1);

            chartCtx.beginPath();
            chartDataPoints.forEach((val, idx) => {
                const normY = cHeight - 15 - ((val - minVal) / range) * (cHeight - 35);
                const normX = idx * stepX;
                if (idx === 0) chartCtx.moveTo(normX, normY);
                else chartCtx.lineTo(normX, normY);
            });

            chartCtx.strokeStyle = '#d35400';
            chartCtx.lineWidth = 2;
            chartCtx.stroke();

            chartCtx.lineTo(cWidth, cHeight);
            chartCtx.lineTo(0, cHeight);
            chartCtx.closePath();
            const fillGrad = chartCtx.createLinearGradient(0, 0, 0, cHeight);
            fillGrad.addColorStop(0, 'rgba(211, 84, 0, 0.15)');
            fillGrad.addColorStop(1, 'rgba(211, 84, 0, 0.0)');
            chartCtx.fillStyle = fillGrad;
            chartCtx.fill();
        }

        /* --- Mentor Exu Caveira --- */
        const exuQuotes = [
            "\"Laroyê! Quer dividir por zero e desafiar o impossível? Corrija essa conta agora.\"",
            "\"Quem erra na encruzilhada dos números perde o rumo. Preste atenção no cálculo!\"",
            "\"Moeda sem lastro ou conta furada não passa pela minha foice. Refaça com clareza.\"",
            "\"A foice corta a ilusão: zere esse visor e faça o cálculo direito!\""
        ];

        function triggerMentor(customMsg) {
            const modal = document.getElementById('exuModal');
            const msgEl = document.getElementById('exuMessage');
            msgEl.textContent = customMsg || exuQuotes[Math.floor(Math.random() * exuQuotes.length)];
            modal.classList.add('active');
        }

        function dismissMentor() {
            document.getElementById('exuModal').classList.remove('active');
        }

        /* --- Lógica da Calculadora & Moedas --- */
        let currentInput = '0';
        let previousInput = '';
        let operator = null;
        let shouldResetDisplay = false;
        let selectedCurrency = 'BRL';
        let calculationCount = 0;
        let historyLogs = JSON.parse(localStorage.getItem('calc_history_logs')) || [];

        const displayEl = document.getElementById('display');
        const currencyIndicatorEl = document.getElementById('currencyIndicator');
        const sourceCurrencyEl = document.getElementById('sourceCurrency');
        const targetCurrencyEl = document.getElementById('targetCurrency');
        const historyBody = document.getElementById('historyBody');

        function populateCurrencyDropdowns() {
            sourceCurrencyEl.innerHTML = '';
            targetCurrencyEl.innerHTML = '';

            Object.keys(CURRENCIES).forEach(code => {
                const opt1 = document.createElement('option');
                opt1.value = code;
                opt1.textContent = `${code} (${CURRENCIES[code].symbol}) - ${CURRENCIES[code].name}`;
                if (code === 'BRL') opt1.selected = true;

                const opt2 = document.createElement('option');
                opt2.value = code;
                opt2.textContent = `${code} (${CURRENCIES[code].symbol}) - ${CURRENCIES[code].name}`;
                if (code === 'USD') opt2.selected = true;

                sourceCurrencyEl.appendChild(opt1);
                targetCurrencyEl.appendChild(opt2);
            });
        }

        function formatValueWithCurrency(val, currCode) {
            const num = parseFloat(val);
            if (isNaN(num)) return val;
            const meta = CURRENCIES[currCode] || { symbol: '', decimals: 2 };
            return `${meta.symbol} ${num.toLocaleString('pt-BR', { minimumFractionDigits: 0, maximumFractionDigits: meta.decimals })}`;
        }

        function updateDisplay() {
            displayEl.value = currentInput;
            const meta = CURRENCIES[selectedCurrency] || CURRENCIES.BRL;
            currencyIndicatorEl.textContent = `${selectedCurrency} (${meta.symbol}) • ${meta.decimals} Decimais`;
        }

        function changeCurrency() {
            selectedCurrency = sourceCurrencyEl.value;
            updateDisplay();
            initVolatilityData(selectedCurrency);
        }

        function addDigit(digit) {
            if (shouldResetDisplay) {
                currentInput = digit;
                shouldResetDisplay = false;
            } else {
                if (currentInput === '0' && digit !== '.') {
                    currentInput = digit;
                } else {
                    if (digit === '.' && currentInput.includes('.')) return;
                    currentInput += digit;
                }
            }
            updateDisplay();
        }

        function deleteDigit() {
            if (shouldResetDisplay) return;
            if (currentInput.length === 1 || (currentInput.length === 2 && currentInput.startsWith('-'))) {
                currentInput = '0';
            } else {
                currentInput = currentInput.slice(0, -1);
            }
            updateDisplay();
        }

        function clearDisplay() {
            currentInput = '0';
            previousInput = '';
            operator = null;
            shouldResetDisplay = false;
            updateDisplay();
        }

        function setOP(op) {
            if (operator !== null && !shouldResetDisplay) calculate();
            previousInput = currentInput;
            operator = op;
            shouldResetDisplay = true;
        }

        function calculate() {
            if (operator === null || shouldResetDisplay) {
                triggerMentor("\"Não há operação pendente para calcular. O que você está tentando fazer?\"");
                return;
            }

            const prev = parseFloat(previousInput);
            const current = parseFloat(currentInput);

            if (isNaN(prev) || isNaN(current)) {
                triggerMentor("\"Números corrompidos! Limpe a mesa e comece de novo.\"");
                currentInput = "ERRO";
                updateDisplay();
                return;
            }

            if (operator === '/' && current === 0) {
                triggerMentor("\"Laroyê! Tentando dividir por zero? Nem a morte quebra as regras da matemática!\"");
                currentInput = "MORTO";
                updateDisplay();
                return;
            }

            let result;
            switch (operator) {
                case '+': result = prev + current; break;
                case '-': result = prev - current; break;
                case '*': result = prev * current; break;
                case '/': result = prev / current; break;
                default: return;
            }

            const decimals = (CURRENCIES[selectedCurrency] || CURRENCIES.BRL).decimals;
            const formattedResult = typeof result === 'number' ? String(parseFloat(result.toFixed(decimals))) : result;
            const meta = CURRENCIES[selectedCurrency] || CURRENCIES.BRL;
            const operationText = `${meta.symbol} ${prev} ${operator} ${current}`;
            const resultDisplay = formatValueWithCurrency(formattedResult, selectedCurrency);
            
            addHistoryEntry(selectedCurrency, operationText, resultDisplay);

            currentInput = formattedResult;
            operator = null;
            updateDisplay();
            shouldResetDisplay = true;
            initVolatilityData(selectedCurrency);

            calculationCount++;
            if (calculationCount > 2) {
                triggerMentor("\"Laroyê! Não se usa calculadora para os cálculos do dia a dia, hein? Preguiça não tem vez aqui. Use o cérebro para pensar, não essas Inteligências Artificiais!\"");
                calculationCount = 0;
            }
        }

        /* --- Conversor de Câmbio --- */
        function convertCurrentValue() {
            const num = parseFloat(currentInput);
            if (isNaN(num)) {
                triggerMentor("\"Digite um valor numérico válido antes de invocar a conversão!\"");
                return;
            }

            const from = sourceCurrencyEl.value;
            const to = targetCurrencyEl.value;

            if (from === to) {
                triggerMentor("\"Origem e destino são a mesma moeda! Não gaste vela com defunto ruim.\"");
                return;
            }

            const fromRate = CURRENCIES[from].rateToUSD;
            const toRate = CURRENCIES[to].rateToUSD;
            const inUSD = num * fromRate;
            const converted = inUSD / toRate;

            const targetDecimals = CURRENCIES[to].decimals;
            const formattedResult = String(parseFloat(converted.toFixed(targetDecimals)));

            const opText = `Câmbio: ${formatValueWithCurrency(num, from)} ➔ ${to}`;
            const resultDisplay = formatValueWithCurrency(formattedResult, to);

            addHistoryEntry(`${from}➔${to}`, opText, resultDisplay);

            selectedCurrency = to;
            sourceCurrencyEl.value = to;
            currentInput = formattedResult;
            updateDisplay();
            shouldResetDisplay = true;
            initVolatilityData(to);

            calculationCount++;
            if (calculationCount > 2) {
                triggerMentor("\"Laroyê! Não se usa calculadora para os cálculos do dia a dia, hein? Preguiça não tem vez aqui. Use o cérebro para pensar, não essas Inteligências Artificiais!\"");
                calculationCount = 0;
            }
        }

        /* --- Suporte Teclado Físico Fluido --- */
        function triggerButtonVisual(btnId) {
            const btn = document.getElementById(btnId);
            if (btn) {
                btn.classList.add('key-pressed');
                setTimeout(() => btn.classList.remove('key-pressed'), 120);
            }
        }

        window.addEventListener('keydown', (event) => {
            if (document.activeElement && document.activeElement.tagName === 'INPUT' && document.activeElement.id !== 'display') {
                return;
            }

            const modal = document.getElementById('exuModal');
            if (modal.classList.contains('active')) {
                if (event.key === 'Enter' || event.key === 'Escape' || event.key === ' ') {
                    dismissMentor();
                }
                return;
            }

            const key = event.key;

            if (key >= '0' && key <= '9') {
                addDigit(key);
                triggerButtonVisual(`key-${key}`);
            } else if (key === '.' || key === ',') {
                addDigit('.');
                triggerButtonVisual('key-dot');
            } else if (key === '+') {
                setOP('+');
                triggerButtonVisual('key-add');
            } else if (key === '-') {
                setOP('-');
                triggerButtonVisual('key-sub');
            } else if (key === '*' || key.toLowerCase() === 'x') {
                setOP('*');
                triggerButtonVisual('key-mul');
            } else if (key === '/') {
                setOP('/');
                triggerButtonVisual('key-div');
            } else if (key === 'Enter' || key === '=') {
                event.preventDefault();
                calculate();
                triggerButtonVisual('key-eq');
            } else if (key === 'Backspace' || key === 'Delete') {
                deleteDigit();
                triggerButtonVisual('key-del');
            } else if (key === 'Escape' || key.toLowerCase() === 'c') {
                clearDisplay();
                triggerButtonVisual('key-c');
            }
        });

        /* --- Histórico --- */
        function addHistoryEntry(currCode, operation, result) {
            const now = new Date();
            const dateStr = now.toLocaleDateString('pt-BR') + ' ' + now.toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' });

            const item = {
                id: Date.now(),
                date: dateStr,
                curr: currCode,
                op: operation,
                res: result,
                desc: ''
            };

            historyLogs.unshift(item);
            saveAndRenderHistory();
        }

        function updateDescription(id, text) {
            const index = historyLogs.findIndex(item => item.id === id);
            if (index !== -1) {
                historyLogs[index].desc = text;
                localStorage.setItem('calc_history_logs', JSON.stringify(historyLogs));
            }
        }

        function clearHistory() {
            historyLogs = [];
            saveAndRenderHistory();
        }

        function saveAndRenderHistory() {
            localStorage.setItem('calc_history_logs', JSON.stringify(historyLogs));
            historyBody.innerHTML = '';

            if (historyLogs.length === 0) {
                historyBody.innerHTML = `<tr><td colspan="5" style="text-align:center; color:#555; padding: 20px;">Nenhum registro ainda</td></tr>`;
                return;
            }

            historyLogs.forEach(item => {
                const row = document.createElement('tr');
                row.innerHTML = `
                    <td>${item.date}</td>
                    <td class="tag-curr">${item.curr}</td>
                    <td class="tag-calc">${item.op}</td>
                    <td class="tag-res">${item.res}</td>
                    <td>
                        <input type="text" class="desc-input" placeholder="Ex: Câmbio, Oferenda..." value="${item.desc || ''}" onchange="updateDescription(${item.id}, this.value)">
                    </td>
                `;
                historyBody.appendChild(row);
            });
        }

        // Inicialização
        populateCurrencyDropdowns();
        updateDisplay();
        saveAndRenderHistory();
        initVolatilityData('BRL');
    </script>
